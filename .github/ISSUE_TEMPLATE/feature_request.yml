name: 功能建议
about: 提议符合轻量边界的新能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        LightTranslate 以轻量、低打扰和隐私优先为边界。请先描述真实使用场景，而不只是功能名称。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么软件、游戏或工作流中遇到问题？
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前如何处理
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明最小可用交互，避免扩展成另一类大型产品。
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: 产品边界
      options:
        - label: 该建议不需要账号、遥测或云同步
        - label: 该建议不会上传原始截图
